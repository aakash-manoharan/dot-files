general {
    gaps_in = 2
    gaps_out = 4
    border_size = 2

    col.active_border = rgba(7aa2f7ee) # rgba(89b4faee) 45deg
    col.inactive_border = rgba(595959aa)

    resize_on_border = false

    allow_tearing = true
    layout = master
}

decoration {
    rounding = 0
    rounding_power = 1
    
    active_opacity = 1
    inactive_opacity = 0.5

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 5
        passes = 1
        # vibrancy = 1
        new_optimizations = true
    }
}

